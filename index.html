<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حكايتنا ❤️</title>
    <style>
        body { margin: 0; background: #9c0022; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; border: 1px solid #ff4d6d; width: 85%; max-width: 450px; margin: 20px 0; }
        .photo-box { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 20px; }
        .photo-box img { width: 100%; border-radius: 15px; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .love-text { font-style: italic; color: #ffb3c1; margin-bottom: 15px; display: block; font-size: 1.2em; font-weight: bold; line-height: 1.5; }
        input { padding: 12px; border-radius: 10px; border: none; width: 80%; margin: 15px 0; text-align: center; font-size: 1.2em; color: #333; }
        button { background: #ff4d6d; color: white; border: none; padding: 12px 35px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .timer-unit { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .timer-unit span { display: block; font-size: 1.5em; font-weight: bold; color: #ffb3c1; }
        #mainScreen { display: none; }
    </style>
</head>
<body>

    <div id="loginScreen" class="card">
        <div style="font-size: 60px;">🔐</div>
        <h2>أدخل التاريخ السري ❤️</h2>
        <input type="text" id="passInput" placeholder="24/9">
        <br>
        <button onclick="check()">فتح الذكريات 🔓</button>
    </div>

    <div id="mainScreen" class="card">
        <h1>ينور عيني.. ❤️</h1>
        <div class="timer-grid">
            <div class="timer-unit"><span id="d">0</span>يوم</div>
            <div class="timer-unit"><span id="h">0</span>ساعة</div>
            <div class="timer-unit"><span id="m">0</span>دقيقة</div>
            <div class="timer-unit"><span id="s">0</span>ثانية</div>
        </div>
        <p style="font-weight: bold;">سوا من يوم: 4/12/2025</p>

        <div class="photo-box">
            <span class="love-text">"في عينيكِ صباحٌ آخر لي، فأنتِ مدينتي وأنتِ حكايتي وأنتِ كل أشيائي."</span>
            <img src="https://i.ibb.co/1GN03FvM/1000308266.jpg" alt="صورة 1">
        </div>

        <div class="photo-box">
            <span class="love-text">"ضحكتك هي اللي بتنور دنيتي وبتخليني أحس إن الحياة لسه بخير."</span>
            <img src="https://i.ibb.co/d0S47SvH/1000308264.jpg" alt="صورة 2">
        </div>

        <div class="photo-box">
            <span class="love-text">"كل لحظة معاكي هي مكسب لقلبي، ربنا يخليكي ليا."</span>
            <img src="https://i.ibb.co/C5xp4S7k/1000308267.jpg" alt="صورة 3">
        </div>

        <p style="font-size: 1.5em; margin-top: 20px;">بحبك يا أغلى ما عندي ❤️🌹</p>
    </div>

    <script>
        function check() {
            if(document.getElementById('passInput').value === '24/9') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                const start = new Date(2025, 11, 4); 
                setInterval(() => {
                    const diff = new Date() - start;
                    document.getElementById('d').innerText = Math.floor(diff/(1000*60*60*24));
                    document.getElementById('h').innerText = Math.floor((diff/(1000*60*60))%24);
                    document.getElementById('m').innerText = Math.floor((diff/(1000*60))%60);
                    document.getElementById('s').innerText = Math.floor((diff/1000)%60);
                }, 1000);
            } else { alert("التاريخ السري غلط يا بطل!"); }
        }
    </script>
</body>
</html>
