<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>إلى حبيبتي أيوشة ❤️</title>
    <style>
        body { margin: 0; background: #4a0404; color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .heart { position: fixed; color: #ff4d6d; font-size: 20px; user-select: none; z-index: -1; animation: fly 5s linear infinite; }
        @keyframes fly { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid #ff4d6d; width: 90%; max-width: 450px; text-align: center; }
        .photo-box { margin: 25px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .photo-box img { width: 100%; border-radius: 15px; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .love-text { color: #ffb3c1; margin-bottom: 10px; display: block; font-size: 1.1em; font-weight: bold; }
        input { padding: 12px; border-radius: 10px; border: none; width: 80%; margin: 15px 0; text-align: center; font-size: 1.2em; background: #fff; color: #333; }
        button { background: #ff4d6d; color: white; border: none; padding: 12px 35px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .timer-unit { background: rgba(0,0,0,0.6); padding: 8px; border-radius: 10px; }
        .timer-unit span { display: block; font-size: 1.3em; font-weight: bold; color: #ffb3c1; }
        #mainScreen { display: none; }
    </style>
</head>
