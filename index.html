<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد حب سعيد ❤️</title>
    <style>
        body { margin: 0; background: #640d14; color: white; font-family: sans-serif; overflow-x: hidden; }
        .heart { position: fixed; color: #ff4d6d; font-size: 20px; user-select: none; z-index: -1; animation: fly 5s linear infinite; }
        @keyframes fly { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); padding: 30px; border-radius: 25px; border: 2px solid #ff4d6d; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .photo-box { margin-bottom: 35px; }
        .photo-box img { width: 100%; border-radius: 20px; border: 4px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .love-text { font-style: italic; color: #ffb3c1; margin-bottom: 15px; display: block; font-size: 1.2em; font-weight: bold; }
        input { padding: 15px; border-radius: 12px; border: none; width: 80%; margin: 20px 0; text-align: center; font-size: 1.3em; background: #fff; color: #333; }
        button { background: #ff4d6d; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1.2em; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 25px 0; }
        .timer-unit { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px; }
        .timer-unit span { display: block; font-size: 1.4em; font-weight: bold; color: #ffb3c1; }
        #mainScreen { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="card">
            <h1 style="font-size: 50px;">💝</h1>
            <h2>Happy Valentine's Day</h2>
            <p>اكتب تاريخنا السري (24/9)</p>
            <input type="text" id="passInput" placeholder="24/9">
            <br>
            <button onclick="check()">فتح القلب ❤️</button>
        </div>

        <div id="mainScreen" class="card">
            <h1 style="color: #ff4d6d;">كل عيد حب وإحنا سوا.. ❤️</h1>
            <div class="timer-grid">
                <div class="timer-unit"><span id="d">0</span>يوم</div>
                <div class="timer-unit"><span id="h">0</span>ساعة</div>
                <div class="timer-unit"><span id="m">0</span>دقيقة</div>
                <div class="timer-unit"><span id="s">0</span>ثانية</div>
            </div>
            <p>مشوارنا بدأ من يوم: 4/12/2025</p>
            <hr style="border: 0.5px solid #ff4d6d; margin: 20px 0;">

            <div class="photo-box">
                <span class="love-text">"في عيد الحب.. حبيت أقولك إنك أحلى صدفة في حياتي"</span>
                <img src="https://lh3.googleusercontent.com/d/1XfH_fK-UoXU_Z5L-qP7fFjY1XyU4f_N5" alt="صورة 1">
            </div>

            <div class="photo-box">
                <span class="love-text">"ضحكتك هي العيد الحقيقي لقلبي"</span>
                <img src="https://lh3.googleusercontent.com/d/1Y-G_fH-UoXU_Z5L-qP7fFjY1XyU4f_N6" alt="صورة 2">
            </div>

            <div class="photo-box">
                <span class="love-text">"كل لحظة معاكي هي مكسب لقلبي"</span>
                <img src="https://lh3.googleusercontent.com/d/1Z-I_fJ-UoXU_Z5L-qP7fFjY1XyU4f_N7" alt="صورة 3">
            </div>

            <p style="font-size: 1.5em; color: #ffb3c1; font-weight: bold;">بحبك يا أغلى من عمري ❤️</p>
        </div>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 300);

        function check() {
            if(document.getElementById('passInput').value === '24/9') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                const start = new Date(2025, 11, 4); 
                setInterval(() => {
                    const diff = new Date() - start;
                    document.getElementById('d').innerText = Math.floor(diff/(1000*60*60*24));
                    document.getElementById('h').innerText = Math.floor((diff/(1000*60*60))%24);
                    document.getElementById('m').innerText = Math.floor((diff/(1000*60))%60);
                    document.getElementById('s').innerText = Math.floor((diff/1000)%60);
                }, 1000);
            } else { alert("ركز يا بطل! ده يومنا المميز ❤️"); }
        }
    </script>
</body>
</html>
